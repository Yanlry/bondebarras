<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2346A0" />
    <title>Bon Débarras — Débarras de maisons, caves, bureaux et terrains · Devis gratuit</title>
    <meta
      name="description"
      content="Bon Débarras vide, trie et évacue vos espaces : maisons, appartements, caves, greniers, successions, bureaux, commerces, entrepôts et terrains. Particuliers et professionnels. Devis gratuit."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Bon Débarras — Faites de la place" />
    <meta
      property="og:description"
      content="Débarras et désencombrement pour les particuliers et les professionnels. Devis gratuit et personnalisé."
    />
    <style>
      /* Écran de chargement statique, visible dès le premier affichage (avant le JavaScript).
         React le remplace par le vrai (components/Preloader), aux mêmes classes : pas de saut.
         Doit rester identique à src/styles/preloader.css (état initial). */
      html,
      body {
        margin: 0;
        background: #f6f3ec;
      }
      .splash {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: grid;
        place-items: center;
        background:
          repeating-linear-gradient(to bottom, transparent 0 70px, rgb(10 20 50 / 0.16) 70px 72px, rgb(255 255 255 / 0.07) 72px 74px),
          #2346a0;
        color: #f6f3ec;
      }
      .splash::after {
        content: '';
        position: absolute;
        inset: auto 0 0;
        height: 22px;
        background:
          linear-gradient(#0f1f4d, #0f1f4d) center 6px / 84px 6px no-repeat,
          #1a347a;
      }
      .splash__column {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
        padding: 0 1.5rem;
        text-align: center;
      }
      .splash__column p {
        margin: 0;
      }
      .splash__brand {
        font-family: 'Bricolage Grotesque Variable', ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(1.5rem, 6vw, 2.1rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .splash__box {
        position: relative;
        width: min(50vw, 30svh, 260px);
        aspect-ratio: 200 / 170;
      }
      .splash__box svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .splash__percent {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 2.4rem;
        font-weight: 500;
        line-height: 1;
      }
      .splash__caption {
        min-height: 1.3em;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" aria-hidden="true">
        <div class="splash__column">
          <p class="splash__brand">Bon Débarras</p>
          <div class="splash__box">
            <svg viewBox="0 0 200 170">
              <ellipse cx="100" cy="132" rx="90" ry="42" fill="#0f1f4d" opacity="0.28" />
              <path d="M24 56 100 94v70l-76-38Z" fill="#c9a27c" />
              <path d="m100 94 76-38v70l-76 38Z" fill="#a9825c" />
              <path d="m100 18 76 38-76 38-76-38Z" fill="#dcbb94" />
              <path d="m62 37 76 38" stroke="#a9825c" stroke-width="1.5" />
              <path d="M100 94v70" stroke="#8f6c4a" stroke-width="1.2" opacity="0.6" />
            </svg>
          </div>
          <p class="splash__percent">0&#8239;%</p>
          <p class="splash__caption">On prépare les cartons…</p>
        </div>
      </div>
    </div>
    <noscript>
      <p style="position: relative; z-index: 301; margin: 0; padding: 1rem; background: #f6f3ec; color: #142033; font-family: system-ui">
        Bon Débarras : débarras de maisons, appartements, caves, successions, bureaux, commerces, entrepôts et terrains, pour les
        particuliers et les professionnels. Activez JavaScript pour afficher le site complet.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
